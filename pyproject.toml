[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-links-app"
version = "0.1.0"
description = "Application to support input link for content find over the web"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["flask>=3.0,<4.0", "databricks-sdk>=0.30,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
databricks-links-app = "databricks_links_app.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
